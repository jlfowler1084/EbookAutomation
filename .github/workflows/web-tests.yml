# EB-291: Web-service test gate.
#
# Runs the pytest suite for the FastAPI billing surface (web_service/) on every
# PR targeting master. The most important member of this suite is
# tests/test_web_payment_e2e.py (EB-273), which asserts the literal success_url
# in checkout.py resolves to a real route — catches the audit-flagged failure
# mode "customer pays, lands on 404" before it reaches production.
#
# Scope is intentionally limited to test_web_*.py:
#   - The pipeline suite (tools/test_pipeline.py) needs Calibre + KFX fixtures
#     that aren't reasonable to bootstrap in CI.
#   - The web tests are pure Python + mocked I/O; they run in ~10 seconds.
#
# This workflow does NOT exercise real Stripe — for that, run
# tools/verify_stripe_e2e.ps1 locally before a production deploy.
#
# EB-330: the suite also includes tests/test_web_send_to_kindle_signed.py, the
# Send-to-Kindle analogue of the Stripe e2e — it drives the real send route then
# fires a real Svix-signed delivery webhook to verify the Unit 4 → Unit 10
# correlation contract (no live Resend call). Its gated TestSendToKindleLiveResend
# class performs a *real* Resend send and runs only when WEB_RESEND_TEST_API_KEY
# (+ a verified sender + a real @kindle.com recipient) are configured as repo
# secrets; otherwise it skips. The manual equivalent is tools/verify_send_to_kindle.ps1.
name: web-tests

on:
  pull_request:
    branches: [master]
    paths:
      - "web_service/**"
      - "tests/test_web_*.py"
      - "tests/conftest.py"
      - "requirements.txt"
      - "dev-requirements.txt"
      - ".github/workflows/web-tests.yml"
  push:
    branches: [master]
    paths:
      - "web_service/**"
      - "tests/test_web_*.py"
      - "tests/conftest.py"

# Allow concurrent PRs but cancel older runs from the same PR.
concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest tests/test_web_*.py
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          # dev-requirements.txt pulls in requirements.txt via `-r`.
          python -m pip install -r dev-requirements.txt

      - name: Run web-service pytest suite
        # Discovery glob matches tests/test_web_*.py (incl. the EB-330 signed
        # e2e). -q keeps output compact; any failure surfaces the full
        # traceback on its own.
        #
        # The live Resend secrets are passed through so the gated
        # TestSendToKindleLiveResend class can run when they're configured;
        # absent them, that class skips and the rest of the suite is unaffected.
        env:
          WEB_RESEND_TEST_API_KEY: ${{ secrets.WEB_RESEND_TEST_API_KEY }}
          WEB_RESEND_TEST_FROM: ${{ secrets.WEB_RESEND_TEST_FROM }}
          WEB_RESEND_TEST_RECIPIENT: ${{ secrets.WEB_RESEND_TEST_RECIPIENT }}
        run: |
          python -m pytest tests/test_web_*.py -q --tb=short
